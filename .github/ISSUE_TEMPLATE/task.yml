name: Task
description: A piece of work that belongs to an epic.
labels: ["task"]
body:
  - type: input
    id: epic
    attributes:
      label: Epic
      description: The epic this belongs to. Add it as a sub-issue of the epic after creating it.
      placeholder: "#3"
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The problem this solves, with any numbers that show it.
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How a reviewer can tell it is finished.
    validations:
      required: true
