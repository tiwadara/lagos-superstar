# Runs on every pull request and every push to main. Merging to main deploys the live
# game (docs/adr/0003-static-hosting-on-netlify.md), so a red check means: do not merge.
name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check every story card
        run: node lint-stories.js

      - name: Play 300 games per row
        shell: bash
        run: node simulate.js 300 | tee simulate-output.txt

      - name: Check the results have no broken numbers
        shell: bash
        run: |
          if grep -q NaN simulate-output.txt; then
            echo "The simulator printed NaN. A rule or story is producing broken numbers."
            exit 1
          fi
