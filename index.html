<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Next Lagos Star</title>
<meta name="description" content="A life simulation of the Lagos entertainment industry. 26 weeks to get on a Detty December stage.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&family=Familjen+Grotesk:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column, like a phone held on a danfo. Status strip on top, stats, then the panel for this moment of the week. */
:root{
  --bg:#f3ecdc;        /* faded poster paper */
  --card:#fffaf0;
  --ink:#1b1712;
  --muted:#6d6252;
  --line:#d9ccb2;
  --danfo:#f6c21a;     /* bus yellow, the accent */
  --danfo-ink:#1b1712;
  --stripe:#1b1712;
  --good:#1f8a52;
  --bad:#c8401f;
  --font-display:"Bowlby One SC","Arial Black",Impact,sans-serif;
  --font-body:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --font-mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#15120e;--card:#211c16;--ink:#f5ecd6;--muted:#a89c85;--line:#3a3227;
  --good:#3fc47a;--bad:#ff6a45;--stripe:#0d0b08;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--font-body);font-size:16px;line-height:1.5;padding:0 16px;padding-block:20px 48px}
#app{max-width:720px;margin:0 auto;display:grid;gap:18px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--danfo);outline-offset:2px}
.label{font-family:var(--font-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.neg{color:var(--bad)}
.pos{color:var(--good)}
.stripe{height:12px;background:repeating-linear-gradient(-45deg,var(--danfo) 0 12px,var(--stripe) 12px 24px);border-radius:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:10px}

/* start */
.intro{display:grid;gap:14px}
.title{font-family:var(--font-display);font-weight:400;font-size:clamp(2.3rem,9vw,4.4rem);line-height:.92}
.title span{background:var(--danfo);color:var(--danfo-ink);padding:0 .12em;border-radius:4px}
.lede{font-size:1.08rem;max-width:58ch}
.field{display:grid;gap:4px}
.field input{background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--ink);font:500 1.05rem var(--font-body);padding:10px 12px;max-width:320px}
.bgs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.bgs{grid-template-columns:minmax(0,1fr)}}
.bg{position:relative;display:grid;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:14px;cursor:pointer}
.bg input{position:absolute;opacity:0;pointer-events:none}
.bg:has(input:checked){border-color:var(--danfo);box-shadow:inset 0 0 0 1px var(--danfo)}
.bg b{font-size:1.05rem}
.bg .text{font-size:.93rem;color:var(--muted)}
.bg .num{font-size:.78rem}
.go{background:var(--danfo);color:var(--danfo-ink);border:0;border-radius:8px;padding:13px 20px;font-family:var(--font-display);font-size:1.15rem;justify-self:start}
.go:active{transform:translateY(1px)}
.small{font-size:.86rem;color:var(--muted)}
.small.neg{color:var(--bad)}

/* status */
.top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center}
.week b{font-family:var(--font-display);font-weight:400;font-size:2.2rem;line-height:1}
.bus{justify-self:center;background:var(--danfo);color:var(--danfo-ink);font-weight:700;font-size:.85rem;padding:5px 12px;border-radius:4px;border:2px solid var(--stripe);text-align:center;transform:rotate(-1.5deg);max-width:100%}
.cash{text-align:right}
.cash b{font-family:var(--font-mono);font-size:1.25rem;font-variant-numeric:tabular-nums;display:block}
@media (max-width:520px){.top{grid-template-columns:auto 1fr}.bus{grid-column:1/-1;grid-row:2;justify-self:start}}
.stats{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:16px;align-items:center}
@media (max-width:520px){.stats{grid-template-columns:minmax(0,1fr)}}
.fans b{font-family:var(--font-display);font-weight:400;font-size:2rem;line-height:1.05;display:block}
.bars{display:grid;grid-template-columns:auto minmax(0,1fr) 2.2em;gap:6px 10px;align-items:center;font-size:.9rem}
.meter{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ink)}
.meter.hype i{background:var(--danfo)}
.deals{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-family:var(--font-mono);font-size:.72rem;border:1px solid var(--line);border-radius:99px;padding:2px 8px}

/* panel */
#panel{display:grid;gap:12px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.head h2{font-size:1.3rem}
.pips{display:flex;gap:6px}
.pips i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}
.pips i.on{background:var(--danfo)}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.actions{grid-template-columns:minmax(0,1fr)}}
.act{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:3px;align-content:start;transition:border-color .12s,transform .12s}
.act:hover:not(:disabled){border-color:var(--ink);transform:translateY(-1px)}
.act:disabled{opacity:.5;cursor:not-allowed}
.act .row{display:flex;justify-content:space-between;gap:8px}
.act b{font-size:1rem}
.act .d{font-size:.88rem;color:var(--muted)}
.act .why{font-size:.8rem;color:var(--bad)}
.end{background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:12px 18px;font-weight:700;justify-self:start}
.result{border-left:6px solid var(--danfo)}
.lines{margin:0;padding:0;list-style:none;display:grid;gap:2px;font-family:var(--font-mono);font-size:.84rem}
.story .who{font-family:var(--font-mono);font-size:.78rem;color:var(--muted)}
.story h3{font-family:var(--font-display);font-weight:400;font-size:1.6rem;line-height:1.05}
.choices{display:grid;gap:8px}
.choice{text-align:left;background:transparent;border:2px solid var(--ink);border-radius:8px;padding:10px 14px;display:grid;gap:2px}
.choice:hover:not(:disabled){background:var(--danfo);color:var(--danfo-ink);border-color:var(--danfo)}
.choice:disabled{opacity:.45;cursor:not-allowed}
.choice span{font-size:.84rem;opacity:.8}
.songs table{width:100%;border-collapse:collapse;font-size:.9rem}
.songs td,.songs th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
.songs th{font-weight:500}
.songs .r{text-align:right}
.tbl{overflow-x:auto}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center}
.link{background:none;border:0;padding:0;text-decoration:underline;color:var(--muted);font-size:.86rem}
.ending{gap:14px}
.ending .title{font-size:clamp(2rem,8vw,3.4rem)}
.summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px}
.summary div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding-bottom:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<noscript>The Next Lagos Star needs JavaScript to run.</noscript>

<script>
/* =====================================================================
   1. Helpers: random numbers and money formatting
   ===================================================================== */
function rand() { return Math.random(); }
function ri(a, b) { return a + Math.floor(rand() * (b - a + 1)); }   // whole number from a to b
function rf(a, b) { return a + rand() * (b - a); }                   // decimal from a to b
function pick(list) { return list[Math.floor(rand() * list.length)]; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function num(n) { return Math.round(n).toLocaleString('en-US'); }
function naira(n) { n = Math.round(n); return (n < 0 ? '-' : '') + '₦' + Math.abs(n).toLocaleString('en-US'); }
function val(x, s) { return typeof x === 'function' ? x(s) : x; }

/* =====================================================================
   2. Content: starting backgrounds, fan tiers, bus slogans, song titles
   ===================================================================== */
const WEEKS = 26;              // weeks until Detty December
const MOVES = 3;               // moves per week
const WEEKLY_COST = 15000;     // food and transport
const START_RENT = 50000;      // one-room in Yaba, due every fourth week
const DEBT_LIMIT = -400000;    // below this the game ends
const STREAM_RATE = 2;         // naira paid per stream, before cuts
const FANS_PER_STREAM = 0.012; // new fans for each stream
const STAT_NAME = { skill: 'Skill', hype: 'Hype', cred: 'Street cred', links: 'Links' };

const BACKGROUNDS = [
  { id: 'choir', name: 'Choir soloist', money: 60000, fans: 40, skill: 35, hype: 0, cred: 5, links: 10,
    text: 'Ten years leading praise in Ebute Metta. You can sing anything. Nobody outside church knows your name.' },
  { id: 'street', name: 'Ajegunle street MC', money: 40000, fans: 120, skill: 20, hype: 5, cred: 30, links: 5,
    text: 'You grew up freestyling at block parties in AJ City. The street rates you. The Island has never heard of you.' },
  { id: 'unilag', name: 'Unilag graduate', money: 120000, fans: 60, skill: 15, hype: 0, cred: 8, links: 25,
    text: 'A Mass Communication degree, a laptop and classmates who now work in media. Your parents want you to do a master\'s.' },
  { id: 'nephew', name: 'Big uncle\'s nephew', money: 250000, fans: 30, skill: 10, hype: 0, cred: 0, links: 35,
    text: 'Your uncle in Lekki knows everybody and pays for nothing. You have soft hands and a good wardrobe.' }
];

const FAN_TIERS = [
  [0, 'Nobody knows you yet'], [200, 'Your street knows you'], [1500, 'Mainland buzz'],
  [8000, 'The blogs are posting you'], [40000, 'Rated'], [150000, 'Lagos star']
];
function fanTier(f) { let t = FAN_TIERS[0][1]; for (const [min, n] of FAN_TIERS) if (f >= min) t = n; return t; }

const BUS_SLOGANS = [
  'No condition is permanent', 'God\'s time is the best', 'Still sweet', 'No food for lazy man',
  'Who know tomorrow', 'Eyes don see, mouth no talk', 'Rest na small', 'Sweet mother',
  'Slow and steady', 'Hustle no dey sleep', 'Monday no be weekend', 'Shine your eye',
  'Holy Ghost fire', 'Mama\'s prayer', 'It is well', 'Blessing on wheels', 'Ojuelegba to the world'
];
const busSlogan = week => BUS_SLOGANS[(week * 7) % BUS_SLOGANS.length];

const TITLE_A = ['Sweet', 'Odogwu', 'Gbese', 'Shakara', 'Overload', 'Jaiye', 'Mainland', 'Holy', 'Owambe',
  'Soft', 'Yawa', 'Pepper', 'Danfo', 'Gidi', 'Omo', 'Kpakpa', 'Lagos', 'Eko', 'Sunday', 'Ginger'];
const TITLE_B = ['Love', 'Vibes', 'Girl', 'Gang', 'Dance', 'Body', 'Matter', 'Prayer', 'Life', 'Season',
  'Baby', 'Energy', 'Bounce', 'Money', 'Mama', 'Wahala', 'Riddim', 'Fever', 'Groove'];
function songTitle(s) {
  let t;
  do { t = pick(TITLE_A) + ' ' + pick(TITLE_B); } while (s.songs.some(x => x.title === t));
  return t;
}
function qualityWord(q) {
  if (q >= 80) return 'The engineer stops eating to listen. This one is special.';
  if (q >= 60) return 'It slaps. People will dance to this.';
  if (q >= 40) return 'It is a decent song. Not your best.';
  return 'It is rough. Your cousin says it is nice, but your cousin says everything is nice.';
}

/* =====================================================================
   3. Money and checks
   ===================================================================== */
// Music income passes through the label, then the manager, then the investor.
function takeHome(s, amount) {
  let left = amount; const cuts = [];
  for (const k of ['label', 'manager', 'investor']) {
    const c = s.flags[k];
    if (c) { const v = Math.round(left * c); left -= v; cuts.push(k + ' ' + naira(v)); }
  }
  return { net: left, cuts };
}

// Stat checks: matching the difficulty is a coin flip, every 10 points either way moves it 20%.
function chance(s, stat, dc) { return clamp(0.5 + (s[stat] - dc) / 50, 0.05, 0.95); }
function chk(s, stat, dc) { return rand() < chance(s, stat, dc); }
function odds(s, stat, dc) { return STAT_NAME[stat] + ' ' + s[stat] + ' against ' + dc + ', about ' + Math.round(chance(s, stat, dc) * 100) + '% chance'; }

function apply(s, fx) {
  const out = [];
  if (!fx) return out;
  if (fx.money) { s.money += fx.money; out.push((fx.money > 0 ? '+' : '') + naira(fx.money)); }
  if (fx.earn) {
    const t = takeHome(s, fx.earn);
    s.money += t.net; s.earned += t.net;
    out.push('+' + naira(t.net) + (t.cuts.length ? ' after cuts (' + t.cuts.join(', ') + ')' : ''));
  }
  let df = 0;
  if (fx.fans) df += fx.fans;
  if (fx.fansUp) df += Math.max(fx.fansUp[0], Math.round(s.fans * fx.fansUp[1]));
  if (fx.fansPct) df += Math.round(s.fans * fx.fansPct);
  if (df) { df = Math.max(df, -s.fans); s.fans += df; out.push((df > 0 ? '+' : '') + num(df) + ' fans'); }
  for (const k of ['skill', 'hype', 'cred', 'links']) {
    if (!fx[k]) continue;
    const before = s[k]; s[k] = clamp(s[k] + fx[k], 0, 100);
    const d = s[k] - before; if (d) out.push(STAT_NAME[k] + ' ' + (d > 0 ? '+' : '') + d);
  }
  if (fx.energyNext) { s.energyNext += fx.energyNext; out.push(fx.energyNext < 0 ? 'One fewer move next week' : 'One extra move next week'); }
  if (fx.rent) { s.rent += fx.rent; out.push('Rent is now ' + naira(s.rent) + ' a month'); }
  if (fx.flag) Object.assign(s.flags, fx.flag);
  if (fx.note) out.push(fx.note);
  return out;
}

/* =====================================================================
   4. Weekly moves
   ===================================================================== */
function showTier(s) {
  if (s.fans >= 60000) return { name: 'Headline a hall on the Island', pay: 1200000, dc: 65 };
  if (s.fans >= 15000) return { name: 'Club appearance in Lekki', pay: 300000, dc: 50 };
  if (s.fans >= 3000) return { name: 'Campus show at Unilag', pay: 80000, dc: 40 };
  if (s.fans >= 300) return { name: 'Friday night at a Surulere lounge', pay: 20000, dc: 30 };
  return { name: 'Open mic in Yaba', pay: 0, dc: 20 };
}

function releaseSong(s) {
  const song = s.songs.filter(x => !x.released).sort((a, b) => b.q - a.q)[0];
  song.released = s.week;
  const reach = (song.q / 100) * (1 + s.hype / 40) * (1 + (s.cred + s.links) / 120);
  let fans = Math.round(reach * rf(100, 250) + s.fans * 0.03 * (song.q / 100));
  const blowChance = clamp((song.q - 60) / 200 + s.hype / 600, 0.01, 0.15);
  let text;
  if (rand() < blowChance) {
    fans = Math.round(fans * ri(3, 6));
    text = '"' + song.title + '" catches fire. Danfo conductors are playing it at Oshodi and someone made a dance for it.';
  } else if (song.q >= 60) {
    text = '"' + song.title + '" is out. The comments are mostly fire emojis.';
  } else {
    text = '"' + song.title + '" is out. Your mother shared it to four WhatsApp groups.';
  }
  song.heat = Math.round(fans * rf(4, 6));
  return { text, fx: { fans, hype: 6 } };
}

const ACTIONS = [
  { id: 'rehearse', label: 'Rehearse', desc: 'Practise in your room until the neighbours bang the wall.',
    run: s => ({ text: pick(['You run the same eight bars two hundred times.', 'You finally hit the note that has been running from you.', 'You learn a new cadence from an old Fela record.']),
      fx: { skill: Math.max(1, Math.round((100 - s.skill) / 12)) } }) },
  { id: 'record', label: 'Record a song', cost: 30000, desc: 'A session at a small studio in Surulere.',
    run: s => {
      const q = clamp(Math.round(s.skill * rf(0.75, 1.1) + ri(0, 12) + (s.flags.producer ? 12 : 0)), 5, 100);
      const title = songTitle(s);
      s.songs.push({ title, q, released: 0, heat: 0, streams: 0 });
      return { text: 'You record "' + title + '". ' + qualityWord(q), fx: {} };
    } },
  { id: 'release', label: 'Release a song', desc: 'Put your best unreleased song on the streaming apps.',
    can: s => s.songs.some(x => !x.released) || 'Record a song first',
    run: releaseSong },
  { id: 'post', label: 'Post content', cost: 2000, desc: 'Data for a skit, a snippet or a freestyle.',
    run: s => rand() < 0.04 + s.hype / 600 + s.skill / 1000
      ? { text: 'Your freestyle inside a moving danfo goes viral. The conductor wants his cut.', fx: { hype: 12, fansUp: [150, 0.12] } }
      : { text: pick(['A snippet in your room. Some likes, one hater.', 'You jump on a dance challenge. It does okay.', 'You post a freestyle on the Third Mainland Bridge. The wind ruins half of it.']),
          fx: { hype: ri(5, 9), fans: ri(5, 25) + Math.round(s.fans * 0.01) } } },
  { id: 'show', label: 'Play a show', desc: s => { const t = showTier(s); return t.name + (t.pay ? ', ' + naira(t.pay) : ', no pay') + '.'; },
    run: s => {
      const t = showTier(s);
      return chk(s, 'skill', t.dc)
        ? { text: 'You own the room. People are singing along by the second chorus.', fx: { earn: t.pay, fansUp: [30, 0.04], cred: 3, hype: 4 } }
        : { text: 'The sound man pulls your mic halfway through. You finish anyway.', fx: { earn: Math.round(t.pay / 2), fans: ri(0, 10), cred: -1 } };
    } },
  { id: 'island', label: 'Show face on the Island', cost: 20000, desc: 'An Uber to Victoria Island, one good outfit, one drink you nurse all night.',
    run: s => !s.flags.met && chk(s, 'links', 35)
      ? { text: 'A woman who books acts for a Lekki lounge takes your number.', fx: { links: ri(4, 7), flag: { met: s.week } } }
      : { text: pick(['You take photos with three people who might be important.', 'Everyone is a CEO. You collect business cards.', 'You get into the VIP section for eleven minutes.']), fx: { links: ri(3, 6) } } },
  { id: 'hustle', label: 'Side hustle', desc: 'A shift at your cousin\'s POS stand in Sabo.',
    run: s => ({ text: pick(['Long queues, short change. It pays.', 'Network is down half the day. You still make something.', 'A customer recognises you. She does not stream your music.']),
      fx: { money: ri(20000, 28000), hype: -2 } }) },
  { id: 'promo', label: 'Buy promo', cost: 60000, desc: 'Playlist pitching, a blog push and two influencers.',
    can: s => s.songs.some(x => x.released) || 'Release a song first',
    run: s => {
      const song = s.songs.filter(x => x.released).sort((a, b) => b.released - a.released)[0];
      song.heat = Math.round(song.heat * 1.5 + 2000);
      return { text: 'Influencers dance to "' + song.title + '" on a Lekki rooftop.', fx: { hype: 15, fans: ri(40, 120) } };
    } }
];
function actionBlock(s, a) {
  if (s.moves <= 0) return 'No moves left this week';
  if (a.can) { const c = a.can(s); if (c !== true) return c; }
  if (a.cost && s.money < a.cost) return 'You need ' + naira(a.cost);
  return '';
}
function doAction(s, id) {
  const a = ACTIONS.find(x => x.id === id);
  if (!a || s.phase !== 'moves' || actionBlock(s, a)) return null;
  if (a.cost) s.money -= a.cost;
  s.moves--;
  const r = a.run(s);
  const lines = apply(s, r.fx);
  if (a.cost) lines.unshift('-' + naira(a.cost));
  s.last = { title: a.label, text: r.text, lines };
  return s.last;
}

/* =====================================================================
   5. Stories
   ===================================================================== */
const EVENTS = [
  { id: 'nepa', title: 'No light', who: 'The power company',
    when: s => true,
    text: 'The power has been off for three days. Your laptop is dead and the studio wants your verse by Friday.',
    choices: [
      { label: 'Buy fuel for the generator', cost: 15000,
        run: s => ({ text: 'The gen coughs, the whole compound hears your verse, and you finish on time.', fx: { skill: 1 } }) },
      { label: 'Work at a friend\'s place in Surulere', hint: 'Costs you a day.',
        run: s => ({ text: 'Two danfos there, two back. The verse is done but the week is gone.', fx: { energyNext: -1, links: 1 } }) },
      { label: 'Write it by candlelight', hint: s => odds(s, 'skill', 35),
        run: s => chk(s, 'skill', 35)
          ? { text: 'No beat, no laptop, just a pen. It might be the best thing you have written.', fx: { skill: 4 } }
          : { text: 'You fall asleep on the page. The studio gives your slot to someone else.', fx: { hype: -3 } } }
    ] },

  { id: 'landlord', title: 'New rent', who: 'Alhaji Rasaki, your landlord',
    when: s => s.week >= 6,
    text: 'Alhaji says the economy is hard for him too. Rent is going up by ₦15,000 a month.',
    choices: [
      { label: 'Pay it and keep the peace', run: s => ({ text: 'He prays for you. It does not reduce the rent.', fx: { rent: 15000 } }) },
      { label: 'Beg him in Yoruba', hint: s => odds(s, 'cred', 35),
        run: s => chk(s, 'cred', 35)
          ? { text: 'You prostrate fully. He settles for ₦5,000.', fx: { rent: 5000 } }
          : { text: 'He is offended you think he is that kind of man. ₦20,000.', fx: { rent: 20000 } } },
      { label: 'Move to a cheaper room in Bariga', cost: 30000, hint: 'Rent drops, but you leave the Yaba scene.',
        run: s => ({ text: 'The room is smaller and the street is louder. The street also likes you.', fx: { rent: -15000, cred: 3, links: -3 } }) }
    ] },

function booking(s) {
  if (s.fans >= 100000) return { name: 'headline the beach festival in Eko Atlantic', dc: 70 };
  if (s.fans >= 30000) return { name: 'perform on the main stage at a Detty December concert', dc: 60 };
  if (s.fans >= 8000) return { name: 'open for Kuyo Boy at his December show', dc: 50 };
  if (s.fans >= 1500) return { name: 'play a packed club night in Lekki', dc: 40 };
  return { name: 'perform at the Yaba street carnival', dc: 30 };
}

function findStory(id) { return id === 'december' ? DECEMBER : EVENTS.concat(FOLLOWUPS).find(e => e.id === id); }
function drawStory(s) {
  const due = FOLLOWUPS.filter(e => !s.seen[e.id] && e.when(s));
  if (due.length) return due[0];
  if (rand() < 0.15) return null;   // a quiet week
  const open = EVENTS.filter(e => !s.seen[e.id] && e.when(s));
  return open.length ? pick(open) : null;
}
function choiceBlock(s, c) {
  if (c.cost && s.money < c.cost) return 'You need ' + naira(c.cost);
  return '';
}
function choose(s, i) {
  const ev = findStory(s.storyId), c = ev && ev.choices[i];
  if (!c || s.phase !== 'story' || choiceBlock(s, c)) return null;
  if (c.cost) s.money -= c.cost;
  const r = c.run(s);
  const lines = apply(s, r.fx);
  if (c.cost) lines.unshift('-' + naira(c.cost));
  s.result = { title: ev.title, choice: c.label, text: r.text, lines };
  s.phase = 'result';
  return s.result;
}

/* =====================================================================
   6. End of week
   ===================================================================== */
function wrapWeek(s) {
  const r = [];
  let streams = 0;
  for (const song of s.songs) {
    if (!song.released) continue;
    streams += song.heat; song.streams += song.heat;
    song.heat = Math.round(song.heat * (0.74 + s.hype / 800));
  }
  if (streams) {
    const t = takeHome(s, streams * STREAM_RATE), nf = Math.round(streams * FANS_PER_STREAM);
    s.money += t.net; s.earned += t.net; s.fans += nf;
    r.push(num(streams) + ' streams paid +' + naira(t.net) + (t.cuts.length ? ' after cuts' : '') + ' and brought ' + num(nf) + ' new fans');
  }
  s.money -= WEEKLY_COST; r.push('Food and transport: -' + naira(WEEKLY_COST));
  if (s.week % 4 === 0) { s.money -= s.rent; r.push('Rent: -' + naira(s.rent)); }
  const h = s.hype; s.hype = Math.max(0, Math.round(s.hype * 0.8) - 1);
  if (h !== s.hype) r.push('Hype cooled from ' + h + ' to ' + s.hype);
  return r;
}
function endWeek(s) {
  if (s.phase !== 'moves') return;
  s.report = wrapWeek(s);
  const ev = s.money < DEBT_LIMIT ? null : drawStory(s);
  s.storyId = ev ? ev.id : null;
  if (ev) s.seen[ev.id] = s.week;
  s.result = null; s.last = null;
  s.phase = ev ? 'story' : 'report';
}
function advance(s) {
  if (s.phase !== 'report' && s.phase !== 'result') return;
  if (s.storyId === 'december') { s.ending = finale(s); s.phase = 'over'; return; }
  if (s.money < DEBT_LIMIT) { s.ending = debtEnding(s); s.phase = 'over'; return; }
  s.storyId = null; s.result = null;
  if (s.week >= WEEKS) {
    s.storyId = 'december'; s.report = ['Six months in Lagos. This is it.']; s.phase = 'story';
    return;
  }
  s.week++;
  s.moves = Math.max(1, MOVES + s.energyNext); s.energyNext = 0;
  s.phase = 'moves';
}

/* =====================================================================
   7. Endings
   ===================================================================== */
const ENDINGS = [
  [150000, 'Lagos star', 'Your song is the sound of December. Danfos, weddings, churches and clubs all play it. Abroad, they are calling it the new Lagos sound, and they are saying your name.'],
  [40000, 'Next rated', 'The blogs have a list of artists to watch next year and you are at the top of it. Your phone does not stop ringing. Your landlord has started greeting you first.'],
  [8000, 'Buzzing', 'People know your songs before they know your face. Bouncers let you in. It is not fame yet, but it is no longer nothing.'],
  [1500, 'Street favourite', 'The mainland knows you. Bus conductors hum your hook. The Island has not caught on, but the street has your back.'],
  [0, 'Upcoming artist', 'Six months, a few songs and a lot of lessons. You are still in the room in Yaba and you are still writing. January is a new season.']
];
function finale(s) {
  const e = ENDINGS.find(x => s.fans >= x[0]);
  return { title: e[1], text: e[2] };
}
function debtEnding(s) {
  return { title: 'Owing everybody', debt: true,
    text: 'You owe ' + naira(-s.money) + '. Your landlord has changed the padlock and your uncle in Ibadan has sent transport money. You pack the cracked phone and the songs. Lagos will still be here.' };
}

function newGame(bgId, name) {
  const bg = BACKGROUNDS.find(b => b.id === bgId) || BACKGROUNDS[0];
  return { v: 1, name: (name || '').trim() || 'Ayo', bg: bg.id,
    week: 1, moves: MOVES, energyNext: 0, money: bg.money, rent: START_RENT, earned: 0,
    fans: bg.fans, skill: bg.skill, hype: bg.hype, cred: bg.cred, links: bg.links,
    songs: [], flags: {}, seen: {}, phase: 'moves', storyId: null, report: null, result: null, last: null, ending: null };
}

// Everything above this line runs without a page, which is how simulate.js loads it.
var GAME = { WEEKS, MOVES, DEBT_LIMIT, BACKGROUNDS, ACTIONS, EVENTS, FOLLOWUPS, DECEMBER, ENDINGS,
  newGame, doAction, actionBlock, endWeek, choose, choiceBlock, advance, findStory, showTier, chance };

/* =====================================================================
   8. Interface
   ===================================================================== */
if (typeof document !== 'undefined') {
  const KEY = 'next-lagos-star-v1';
  const app = document.getElementById('app');
  let S = load();
  let draft = { name: '', bg: 'choir' };
  let confirmNew = false;
  let lastPhase = S && S.phase;

  function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); return s && s.v === 1 ? s : null; } catch (e) { return null; } }
  function save() { try { if (S) localStorage.setItem(KEY, JSON.stringify(S)); else localStorage.removeItem(KEY); } catch (e) {} }
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const tone = l => /^\+/.test(l) ? 'pos' : /(^|: |\s)-(₦|\d)/.test(l) ? 'neg' : '';
  const lines = ls => ls && ls.length ? '<ul class="lines">' + ls.map(l => '<li class="' + tone(l) + '">' + esc(l) + '</li>').join('') + '</ul>' : '';

  function viewStart() {
    return '<header class="intro"><div class="stripe" aria-hidden="true"></div>' +
      '<h1 class="title">The Next <span>Lagos</span> Star</h1>' +
      '<p class="lede">You arrive with a one-room in Yaba, a cracked phone and a voice. You have 26 weeks to get on a Detty December stage.</p></header>' +
      '<label class="field"><span class="label">Your stage name</span><input id="name" maxlength="24" autocomplete="off" placeholder="Ayo" value="' + esc(draft.name) + '"></label>' +
      '<div class="field"><span class="label">Where you are coming from</span><div class="bgs" role="radiogroup">' +
      BACKGROUNDS.map(b => '<label class="bg"><input type="radio" name="bg" value="' + b.id + '"' + (draft.bg === b.id ? ' checked' : '') + '>' +
        '<b>' + esc(b.name) + '</b><span class="text">' + esc(b.text) + '</span>' +
        '<span class="num">' + naira(b.money) + ' · Skill ' + b.skill + ' · Cred ' + b.cred + ' · Links ' + b.links + '</span></label>').join('') +
      '</div></div>' +
      '<button class="go" data-do="start">Move to Yaba</button>' +
      '<p class="small">A first playable prototype with one career, the music artist. All characters, companies and events are fictional.</p>';
  }

  function viewStatus() {
    const due = (4 - S.week % 4) % 4;
    const deals = ['label', 'manager', 'investor'].filter(k => S.flags[k])
      .map(k => '<span class="chip">' + k[0].toUpperCase() + k.slice(1) + ' ' + Math.round(S.flags[k] * 100) + '%</span>');
    if (S.flags.producer) deals.push('<span class="chip">Producer</span>');
    return '<header class="top">' +
      '<div class="week"><span class="label">Week</span><b>' + S.week + '</b><span class="small"> of ' + WEEKS + '</span></div>' +
      '<div class="bus" title="Written on today\'s danfo">' + esc(busSlogan(S.week)) + '</div>' +
      '<div class="cash"><span class="label">Cash</span><b class="' + (S.money < 0 ? 'neg' : '') + '">' + naira(S.money) + '</b>' +
      '<span class="small">Rent ' + naira(S.rent) + (due ? ' in ' + due + (due === 1 ? ' week' : ' weeks') : ' this week') + '</span></div>' +
      '</header>' +
      '<section class="stats card">' +
      '<div class="fans"><span class="label">Fans</span><b>' + num(S.fans) + '</b><span class="small">' + fanTier(S.fans) + '</span>' +
      (deals.length ? '<div class="deals">' + deals.join('') + '</div>' : '') + '</div>' +
      '<div class="bars">' + ['skill', 'hype', 'cred', 'links'].map(k =>
        '<span>' + STAT_NAME[k] + '</span><div class="meter' + (k === 'hype' ? ' hype' : '') + '"><i style="width:' + S[k] + '%"></i></div><span class="num">' + S[k] + '</span>').join('') +
      '</div>' +
      (S.money < 0 ? '<p class="small neg" style="grid-column:1/-1">You are in debt. Past ' + naira(-DEBT_LIMIT) + ' the game is over.</p>' : '') +
      '</section>';
  }

  function viewMoves() {
    const pips = Array.from({ length: Math.max(S.moves, MOVES) }, (_, i) => '<i class="' + (i < S.moves ? 'on' : '') + '"></i>').join('');
    return '<div class="head"><h2>' + (S.moves ? 'What will you do this week?' : 'That\'s the week.') + '</h2>' +
      '<span class="pips" role="img" aria-label="' + S.moves + ' moves left">' + pips + '</span></div>' +
      (S.last ? '<div class="card result"><span class="label">' + esc(S.last.title) + '</span><p>' + esc(S.last.text) + '</p>' + lines(S.last.lines) + '</div>' : '') +
      '<div class="actions">' + ACTIONS.map(a => {
        const why = actionBlock(S, a);
        return '<button class="act" data-do="act:' + a.id + '"' + (why ? ' disabled' : '') + '>' +
          '<span class="row"><b>' + esc(a.label) + '</b>' + (a.cost ? '<span class="num">' + naira(a.cost) + '</span>' : '') + '</span>' +
          '<span class="d">' + esc(val(a.desc, S)) + '</span>' +
          (why && S.moves ? '<span class="why">' + esc(why) + '</span>' : '') + '</button>';
      }).join('') + '</div>' +
      '<button class="end" data-do="end">End week ' + S.week + (S.moves ? ' (' + S.moves + ' unused)' : '') + '</button>';
  }

  function viewReport() {
    return '<div class="card"><span class="label">' + (S.storyId === 'december' ? 'December' : 'End of week ' + S.week) + '</span>' + lines(S.report) + '</div>';
  }
  function viewStory() {
    const ev = findStory(S.storyId);
    return viewReport() +
      '<div class="card story"><span class="who">' + esc(val(ev.who, S)) + '</span><h3>' + esc(ev.title) + '</h3>' +
      '<p>' + esc(val(ev.text, S)) + '</p><div class="choices">' +
      ev.choices.map((c, i) => {
        const why = choiceBlock(S, c), hint = val(c.hint, S);
        return '<button class="choice" data-do="choose:' + i + '"' + (why ? ' disabled' : '') + '><b>' + esc(c.label) + (c.cost ? ' · ' + naira(c.cost) : '') + '</b>' +
          (why || hint ? '<span>' + esc(why || hint) + '</span>' : '') + '</button>';
      }).join('') + '</div></div>';
  }
  function nextLabel() {
    if (S.storyId === 'december') return 'See how it ended';
    if (S.money < DEBT_LIMIT) return 'Face the debt';
    return S.week >= WEEKS ? 'On to December' : 'Start week ' + (S.week + 1);
  }
  function viewResult() {
    return '<div class="card result"><span class="label">' + esc(S.result.title) + ' · ' + esc(S.result.choice) + '</span>' +
      '<p>' + esc(S.result.text) + '</p>' + lines(S.result.lines) + '</div>' +
      '<button class="go" data-do="next">' + nextLabel() + '</button>';
  }
  function viewQuiet() {
    return viewReport() + '<p>A quiet week. Nothing happened except Lagos.</p><button class="go" data-do="next">' + nextLabel() + '</button>';
  }

  function viewSongs() {
    if (!S.songs.length) return '';
    return '<section class="songs card"><span class="label">Your songs</span><div class="tbl"><table>' +
      '<tr><th>Title</th><th class="r">Quality</th><th class="r">Status</th><th class="r">Streams</th></tr>' +
      S.songs.map(x => '<tr><td>' + esc(x.title) + '</td><td class="r num">' + x.q + '</td><td class="r">' +
        (x.released ? 'Out since week ' + x.released : 'Unreleased') + '</td><td class="r num">' + num(x.streams) + '</td></tr>').join('') +
      '</table></div></section>';
  }

  function viewFoot() {
    const bg = BACKGROUNDS.find(b => b.id === S.bg);
    return '<footer class="foot small"><span>' + esc(S.name) + ' · ' + esc(bg.name) + '</span>' +
      (confirmNew ? '<span>Start over and lose this game? <button class="link" data-do="reset">Yes</button> · <button class="link" data-do="keep">No</button></span>'
        : '<button class="link" data-do="new">New game</button>') + '</footer>';
  }

  function viewOver() {
    const e = S.ending, released = S.songs.filter(x => x.released);
    const best = released.slice().sort((a, b) => b.streams - a.streams)[0];
    return '<div class="stripe" aria-hidden="true"></div><section class="ending card">' +
      '<span class="label">' + esc(S.name) + ' · ' + (e.debt ? 'Game over in week ' + S.week : 'December, after 26 weeks') + '</span>' +
      '<h1 class="title">' + esc(e.title) + '</h1><p class="lede">' + esc(e.text) + '</p>' +
      '<div class="summary">' +
      '<div><span>Fans</span><b class="num">' + num(S.fans) + '</b></div>' +
      '<div><span>Cash</span><b class="num ' + (S.money < 0 ? 'neg' : '') + '">' + naira(S.money) + '</b></div>' +
      '<div><span>Songs released</span><b class="num">' + released.length + '</b></div>' +
      '<div><span>Music income</span><b class="num">' + naira(S.earned) + '</b></div>' +
      '<div><span>Skill</span><b class="num">' + S.skill + '</b></div>' +
      '<div><span>Links</span><b class="num">' + S.links + '</b></div>' +
      '</div>' + (best ? '<p>Your biggest song was "' + esc(best.title) + '" with ' + num(best.streams) + ' streams.</p>' : '') +
      '<button class="go" data-do="reset">Play again</button></section>';
  }

  function render() {
    if (!S) app.innerHTML = viewStart();
    else if (S.phase === 'over') app.innerHTML = viewOver();
    else {
      const panel = S.phase === 'moves' ? viewMoves() : S.phase === 'story' ? viewStory() : S.phase === 'result' ? viewResult() : viewQuiet();
      app.innerHTML = viewStatus() + '<main id="panel">' + panel + '</main>' + viewSongs() + viewFoot();
    }
    save();
    const phase = S && S.phase;
    if (phase !== lastPhase) {
      lastPhase = phase;
      const target = document.getElementById('panel') || app;
      if (target.getBoundingClientRect().top < 0) target.scrollIntoView({ block: 'start' });
      const first = document.querySelector('#panel .choice:not(:disabled), #panel .go, .ending .go');
      if (first) first.focus({ preventScroll: true });
    }
  }

  app.addEventListener('input', e => { if (e.target.id === 'name') draft.name = e.target.value; });
  app.addEventListener('change', e => { if (e.target.name === 'bg') draft.bg = e.target.value; });
  app.addEventListener('click', e => {
    const b = e.target.closest('[data-do]');
    if (!b || b.disabled) return;
    const [cmd, arg] = b.dataset.do.split(':');
    if (cmd === 'start') S = newGame(draft.bg, draft.name);
    else if (cmd === 'act') doAction(S, arg);
    else if (cmd === 'end') endWeek(S);
    else if (cmd === 'choose') choose(S, +arg);
    else if (cmd === 'next') advance(S);
    else if (cmd === 'new') confirmNew = true;
    else if (cmd === 'keep') confirmNew = false;
    else if (cmd === 'reset') { S = null; confirmNew = false; draft = { name: '', bg: 'choir' }; }
    render();
  });

  render();
}
</script>
</body>
</html>
