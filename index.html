<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Next Lagos Star</title>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --danfo:#FFC40C;
  --bg:#EDF0F8; --card:#FFFFFF; --ink:#0E1330; --muted:#555B7B; --line:#D3D9EA;
  --accent:#2231A0;
  --up:#0A7A45; --up-bg:#E2F4EA; --down:#B5121F; --down-bg:#FBE6E8; --note-bg:#E6E9FA;
  --btn:#000000; --btn-ink:#FFC40C; --bar:#0E1330; --track:#DCE1F0;
  --scrim:rgba(9,13,36,.62);
  --display:'Bowlby One',Impact,'Arial Black',sans-serif;
  --body:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#090D24; --card:#131943; --ink:#ECEEFF; --muted:#A3A9CF; --line:#283069;
    --accent:#9AA8FF;
    --up:#52E09A; --up-bg:#0F3A2A; --down:#FF8A93; --down-bg:#46151C; --note-bg:#1E2660;
    --btn:#FFC40C; --btn-ink:#000000; --bar:#FFC40C; --track:#232B5E;
    --scrim:rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#090D24; --card:#131943; --ink:#ECEEFF; --muted:#A3A9CF; --line:#283069;
  --accent:#9AA8FF;
  --up:#52E09A; --up-bg:#0F3A2A; --down:#FF8A93; --down-bg:#46151C; --note-bg:#1E2660;
  --btn:#FFC40C; --btn-ink:#000000; --bar:#FFC40C; --track:#232B5E;
  --scrim:rgba(0,0,0,.7);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
#app{max-width:480px;margin:0 auto}

/* The danfo panel: the one loud thing on the page */
.danfo{background:var(--danfo);color:#000;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-bottom:6px}
.danfo-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 16px 0}
.danfo-name{font-family:var(--display);font-weight:400;font-size:1.35rem;line-height:1.05;text-transform:uppercase;overflow-wrap:anywhere}
.danfo-week{font-weight:700;white-space:nowrap;font-size:.95rem}
.danfo-week span{font-weight:500}
.danfo-figs{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:2px 16px 8px;font-size:1.05rem;font-variant-numeric:tabular-nums}
.danfo-figs b{font-weight:800;font-size:1.3rem;border-radius:4px}
.danfo-figs .owing{color:#8A0011}
.stripe{background:#000;color:var(--danfo);font-family:var(--display);font-size:.78rem;line-height:1;padding:7px 16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stripe-thin{height:5px;background:#000;margin-top:4px}
.bump{animation:bump .7s ease-out}
@keyframes bump{0%{background:#000;color:var(--danfo)}100%{background:transparent;color:inherit}}

.danfo-title{position:static;padding-bottom:8px}
.title{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(2.8rem,14.5vw,4.6rem);line-height:.92;letter-spacing:-.01em;padding:28px 16px 18px}
.danfo-title .stripe{font-size:.95rem;padding:9px 16px}

.pad{padding:16px}
.lede{font-size:1.1rem;line-height:1.4}
.stack > * + *{margin-top:16px}

/* Buttons */
.primary{display:block;width:100%;min-height:54px;border:0;border-radius:10px;background:var(--btn);color:var(--btn-ink);font-family:var(--display);font-size:1.05rem;padding:12px 16px}
.primary:active{transform:translateY(1px)}
.secondary{display:block;width:100%;min-height:50px;border:2px solid var(--ink);border-radius:10px;background:transparent;font-weight:700;padding:10px 16px}
.link{background:none;border:0;padding:8px 4px;min-height:44px;color:var(--muted);text-decoration:underline;font-size:.9rem}

/* Title screen form */
label.field,legend{font-weight:700;display:block;margin-bottom:6px;padding:0}
.name-row{display:flex;gap:8px}
.name-row input{flex:1;min-width:0;min-height:50px;border:2px solid var(--ink);border-radius:10px;background:var(--card);padding:8px 12px;font-weight:600}
.name-row button{min-height:50px;border:2px solid var(--ink);border-radius:10px;background:transparent;padding:8px 12px;font-weight:600;white-space:nowrap}
fieldset{border:0;margin:0;padding:0}
.origin{display:block;position:relative;border:2px solid var(--line);border-radius:10px;background:var(--card);padding:12px 14px 12px 44px;margin-top:8px;cursor:pointer}
.origin input{position:absolute;left:14px;top:15px;width:18px;height:18px;margin:0;accent-color:var(--ink)}
.origin b{display:block}
.origin span{color:var(--muted);font-size:.92rem}
.origin:has(input:checked){border-color:var(--ink)}
details{border-top:1px solid var(--line);padding-top:12px}
summary{font-weight:700;cursor:pointer;padding:11px 0}
details ul{margin:8px 0 0;padding-left:20px}
details li{margin-top:4px}

/* Game screen */
.tier{padding:10px 16px 0;font-size:.92rem;color:var(--muted)}
.goal{margin:0 16px 10px;font-size:.95rem}
.tier b{color:var(--ink)}
.meters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px 16px 0}
.meter-top{display:flex;justify-content:space-between;align-items:baseline;font-size:.82rem;color:var(--muted)}
.meter-top b{color:var(--ink);font-size:.95rem;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--track);border-radius:3px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--bar);border-radius:3px;transition:width .35s ease}

.latest{margin:12px 16px 0;background:var(--card);border-left:6px solid var(--danfo);border-radius:4px 10px 10px 4px;padding:12px 14px;min-height:5.4em;scroll-margin-top:150px}
.latest.fresh{animation:rise .25s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:.82rem;font-weight:700;padding:2px 8px;border-radius:999px;font-variant-numeric:tabular-nums}
.chip.up{color:var(--up);background:var(--up-bg)}
.chip.down{color:var(--down);background:var(--down-bg)}
.chip.note{color:var(--accent);background:var(--note-bg)}

.moves-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px 8px;font-size:.92rem}
.moves-left{display:flex;align-items:center;gap:8px;font-weight:700}
.rent{color:var(--muted);text-align:right}
.rent.soon{color:var(--down);font-weight:700}
.pips{display:inline-flex;gap:4px}
.pip{width:11px;height:11px;border-radius:50%;border:2px solid currentColor}
.pip.on{background:currentColor}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px}
.act{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;min-height:76px;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:9px 11px}
.act:not(:disabled):active{border-color:var(--ink);transform:translateY(1px)}
.act-name{font-weight:700;line-height:1.2}
.act-sub{font-size:.8rem;color:var(--muted);line-height:1.25}
.act-cost{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:.82rem;font-weight:700;font-variant-numeric:tabular-nums}
.act-cost .pip{width:8px;height:8px}
.act:disabled{cursor:not-allowed;background:transparent;border-style:dashed}
.act:disabled .act-name,.act:disabled .act-cost{opacity:.5}
.endweek{padding:12px 16px 0}
.tip{margin:0 16px 10px;padding:8px 12px;border-radius:8px;background:var(--note-bg);color:var(--accent);font-size:.9rem;font-weight:600}
.fine{font-size:.85rem;color:var(--muted)}
.more{padding:14px 16px 0}
.more ul{list-style:none;padding:0;margin:6px 0 0}
.more li{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.more li span:last-child{color:var(--muted);text-align:right}
.more h3{font-size:.92rem;margin-top:12px}
.earlier{padding:14px 16px 0}
.earlier h2{font-size:.92rem;color:var(--muted);font-weight:700}
.earlier p{font-size:.9rem;color:var(--muted);padding:6px 0;border-bottom:1px solid var(--line)}
.foot{padding:12px 16px 84px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}

/* Sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet-card{background:var(--bg);width:100%;max-width:480px;max-height:92%;overflow-y:auto;overscroll-behavior:contain;border-radius:16px 16px 0 0;border-top:8px solid var(--danfo);padding:18px 16px calc(76px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(28px);opacity:.4}to{transform:none;opacity:1}}
@media (min-width:560px){.sheet{align-items:center}.sheet-card{border-radius:16px;padding-bottom:18px}}
.sheet h2{font-family:var(--display);font-weight:400;font-size:1.6rem;line-height:1.05;text-transform:uppercase}
.sheet h2:focus{outline:none}
.who{color:var(--muted);font-size:.92rem;margin-top:4px}
.story{margin-top:12px;font-size:1.05rem;line-height:1.45}
.picked{margin-top:10px;font-weight:700;font-size:.92rem;color:var(--accent)}
.choices{display:grid;gap:8px;margin-top:16px}
.choice{display:grid;grid-template-columns:1fr auto;gap:2px 12px;text-align:left;background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:11px 13px;min-height:58px}
.choice:not(:disabled):active{transform:translateY(1px)}
.choice-label{font-weight:700}
.choice-cost{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.choice-hint{grid-column:1 / -1;font-size:.85rem;color:var(--muted);line-height:1.3}
.choice:disabled{border-style:dashed;border-color:var(--line);background:transparent;cursor:not-allowed}
.choice:disabled .choice-label,.choice:disabled .choice-cost{opacity:.5}
.wrap{margin-top:18px;border-top:2px solid var(--ink);padding-top:12px}
.wrap h3{font-size:1rem}
.wrap ul{list-style:none;margin:6px 0 16px;padding:0}
.wrap li{display:grid;grid-template-columns:1fr auto;gap:0 12px;padding:6px 0;border-bottom:1px solid var(--line)}
.wrap li b{font-variant-numeric:tabular-nums}
.wrap li b.up{color:var(--up)} .wrap li b.down{color:var(--down)}
.wrap li small{grid-column:1 / -1;color:var(--muted);font-size:.82rem}

/* End screen */
.end-name{padding:22px 16px 14px}
.end-name .title{padding:0;font-size:clamp(2.4rem,13vw,4rem)}
.end-name p{font-weight:700;margin-bottom:6px}
.verdict{font-size:1.1rem;line-height:1.4}
.notes{margin-bottom:0;padding-left:20px}
.notes li{margin-top:6px}
.tally{list-style:none;margin-bottom:0;padding:0;border-top:2px solid var(--ink)}
.tally li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.tally b{font-variant-numeric:tabular-nums;text-align:right}

/* Feedback form */
.feedback{border-top:2px solid var(--ink);padding-top:14px}
.feedback > * + *{margin-top:12px}
.feedback h2{font-size:1.15rem}
.career-head{font-size:1.15rem;margin-bottom:8px}
.feedback textarea,.feedback input[type=text]{display:block;width:100%;font-weight:400;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:8px 12px;font-family:inherit;font-size:1rem;margin-top:4px}
.feedback .opts{display:flex;flex-wrap:wrap;gap:6px}
.feedback .opts label{display:inline-flex;align-items:center;gap:6px;min-height:44px;border:2px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:500}
.feedback .opts label:has(input:checked){border-color:var(--ink);font-weight:700}
.feedback .opts input{accent-color:var(--ink);margin:0}
.feedback .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.fb-status{font-weight:700;color:var(--accent)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden></div>
<!-- Netlify Forms reads this hidden copy at deploy time. The visible form is built in feedbackHtml() and posts the same fields. -->
<form name="feedback" data-netlify="true" netlify-honeypot="company" hidden>
  <input name="company"><input name="ending"><input name="career"><input name="background"><input name="week"><input name="fans">
  <input name="duration"><textarea name="confused"></textarea><input name="favourite"><input name="again"><textarea name="anything"></textarea>
</form>

<script src="stories.js"></script>
<script>
'use strict';

/* ---------- helpers ---------- */
const TOTAL_WEEKS = 26;
const SAVE_KEY = 'next-lagos-star-v1';
// Seeded random numbers: mulberry32, small and fast, plenty for a game.
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rnd=Math.random;
const R = {
  f:()=>rnd(),
  n:(a,b)=>a+rnd()*(b-a),
  i:(a,b)=>Math.floor(a+rnd()*(b-a+1)),
  p:x=>rnd()<x,
  pick:a=>a[Math.floor(rnd()*a.length)],
  // R.seed(n) makes every roll after it repeatable (daily story, weekly challenge, simulator). R.seed() goes back to Math.random.
  seed:n=>{rnd=n==null?Math.random:mulberry32(n);}
};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const val=(x,s)=>typeof x==='function'?x(s):x;
function naira(n){const a=Math.abs(Math.round(n));return (n<0?'−':'')+'₦'+a.toLocaleString('en-US');}
function nairaShort(n){const a=Math.abs(n);if(a>=1e6)return '₦'+(a/1e6).toFixed(a%1e6?1:0)+'m';if(a>=1000)return '₦'+Math.round(a/1000)+'k';return '₦'+a;}
function fansFmt(n){if(n<10000)return Math.round(n).toLocaleString('en-US');if(n<1e6)return (n/1000).toFixed(1).replace(/\.0$/,'')+'k';return (n/1e6).toFixed(2).replace(/0$/,'')+'m';}
function listOf(a){const u=[...new Set(a)];return u.length<2?u.join(''):u.slice(0,-1).join(', ')+' and '+u[u.length-1];}

/* ---------- content ---------- */
// Fan floors for the five tiers, top first. Every career shares them and names them its own way (CAREERS[id].tiers).
const TIER_MINS=[1000000,100000,10000,1000,0];
// tierOf(fans, s) gives the tier's rank (0 is the top), its fan floor and the player's career's name for it.
function tierOf(f,s){const i=TIER_MINS.findIndex(m=>f>=m);return {i,min:TIER_MINS[i],name:careerOf(s).tiers[i]};}
function nextTier(f,s){const i=tierOf(f,s).i-1;return i>=0?{i,min:TIER_MINS[i],name:careerOf(s).tiers[i]}:null;}

const SLOGANS=['{n} no dey carry last','Who know {n}? Everybody','{n} on the mic tonight','No food for lazy man','God’s time is the best','Shine your eye','E go better','No condition is permanent','Who knows tomorrow?','Let them say','The young shall grow','Sea never dry','Hustle and pray','Lagos no dey sleep','Up we go','Humble yourself','Slow and steady','Back to sender','No shaking'];
const OPENERS=[
  'Monday. The generator next door starts before your alarm does.',
  'It rained all night. Your street is now a river with okadas in it.',
  'Your data finished in the middle of an upload. Again.',
  'Third Mainland Bridge is at a standstill. You write two verses in traffic.',
  'Light came back at 3am. You ironed everything you own.',
  'Your neighbour’s church has started a seven-day programme. With speakers.',
  'The fuel queue runs from your junction to the next junction.',
  'The suya man now greets you by your stage name.',
  'Somebody’s uncle asks if you can “do something small” for his company. For free.',
  'You wake up to twelve voice notes from a promoter. None of them mention money.',
  'The landlord’s wife says she heard you singing. She does not say if she liked it.',
  'A danfo conductor shouts “{n}! Oshodi, Oshodi!” as a bus stop joke. You take it as press.'
];
// The actor's week openers: the same city, seen from a film set.
const ACTOR_OPENERS=[
  'Monday. The generator next door starts before your alarm does.',
  'It rained all night. Your street is now a river with okadas in it.',
  'Your data finished in the middle of an upload. Again.',
  'Third Mainland Bridge is at a standstill. You learn two pages of lines in traffic.',
  'Light came back at 3am. You ironed everything you own.',
  'Your neighbour’s church has started a seven-day programme. With speakers.',
  'The fuel queue runs from your junction to the next junction.',
  'The suya man now greets you by your stage name.',
  'Somebody’s uncle asks if you can “act something small” in his company’s advert. For free.',
  'You wake up to twelve voice notes from a producer. None of them mention money.',
  'The landlord’s wife says she saw you in a skit. She does not say if she liked it.',
  'A danfo conductor shouts “{n}! Oshodi, Oshodi!” as a bus stop joke. You take it as press.'
];
const SONG_TITLES=['Conductor, My Change','Monday Morning Hold-Up','Jollof and Regret','Two-Bedroom in Lekki','Bolt Driver Cancelled','Sapa Is a Teacher','Agege Bread Love','No Light Again','Third Mainland at 5pm','Small Chops','Shine Your Eye','Mummy’s Prayer','Detty Forever','Yaba Left','Owambe Sunday','Generator Lullaby','One Room, One Dream','Who Send Me?','Island Girl, Mainland Boy','Transfer Has Entered','Keke to Heaven','Low Battery','Aunty, Calm Down','Odogwu in Traffic'];
const STAGE_NAMES=['Ronke Riddim','Omo Yaba','Temi Gold','Fine Boy Dayo','Queen Ada','Kashy Wonder','Bella Vibez','Young Sapa','Sisi Mainland','Ebuka Flames','Zino Wavy','Lady Shalewa'];

// Fictional films and series. Check new titles are not real Nollywood films.
const ROLE_TITLES=['Blood Money in Ikeja','The Pastor’s Second Wife','Village Girl in Lekki','Jollof Wars','Aso Ebi Palava','Third Mainland Love','The Houseboy’s Revenge','Sapa Diaries','Danfo Driver’s Daughter','Kidnapped in Ajah','Owambe Wahala','Baba Landlord Returns','Two Wives, One Generator','Area Father','Love in the Time of NEPA','Bride Price','Okada to the Altar','The Mansion in Banana Island','Tears of Agege','Yaba Boys'];
function roleWord(q){return q<30?'a bit part':q<50?'a decent role':q<68?'a scene-stealer':q<85?'a strong lead':'a career-making role';}
function roleTitle(s){
  const used=new Set([...s.vault,...s.songs].map(x=>x.title));
  const free=ROLE_TITLES.filter(t=>!used.has(t));
  // From the second season, once every title is taken, Nollywood makes sequels.
  if(!free.length&&s.season>1){const seq=ROLE_TITLES.map(t=>t+' 2').filter(t=>!used.has(t));if(seq.length)return R.pick(seq);}
  return free.length?R.pick(free):'Untitled project '+(used.size+1);
}
function qWord(q){return q<30?'a rough demo':q<50?'a decent record':q<68?'a bop':q<85?'a proper jam':'a hit';}
function songTitle(s){
  const used=new Set([...s.vault,...s.songs].map(x=>x.title));
  const free=SONG_TITLES.filter(t=>!used.has(t));
  // From the second season, once every title is taken, old songs come back as remixes.
  if(!free.length&&s.season>1){const mix=SONG_TITLES.map(t=>t+' (Remix)').filter(t=>!used.has(t));if(mix.length)return R.pick(mix);}
  return free.length?R.pick(free):'Untitled '+(used.size+1);
}

/* ---------- money and checks ---------- */
function takeHome(s,gross){
  let net=gross;const who=[];
  if(s.flags.signed){
    who.push('Gbedu Empire');
    if(s.recoup>0){const pay=Math.min(s.recoup,net);s.recoup-=pay;net-=pay;}
    net*=0.3;
  }
  if(s.flags.signedGood){net*=0.8;who.push('Gbedu Empire');}
  if(s.flags.manager){net*=0.8;who.push('Aunty Bisi');}
  if(s.flags.investor){net*=0.7;who.push('Chad');}
  return {net:Math.round(net),who};
}
const STAT_NAMES={links:'links',cred:'street cred',skill:'skill',hype:'hype'};
function chk(s,stat,need){return s[stat]+(s.flags.manager?8:0)+R.i(-6,6)>=need;}
function odds(s,stat,need){
  const d=s[stat]+(s.flags.manager?8:0)-need;
  const v=d>=6?'Should work.':d>=-6?'Could go either way.':'Long shot.';
  return 'Depends on your '+STAT_NAMES[stat]+' ('+s[stat]+'). '+v;
}

// How a character feels about you, from −10 to 10 (#28). Old saves have no s.rel, so this reads 0.
const rel=(s,id)=>(s.rel&&s.rel[id])||0;
const met=(s,id)=>!!s.rel&&id in s.rel;
const REL_WORDS=[[-5,'Enemy'],[-1,'Cold'],[2,'Neutral'],[6,'Warm'],[11,'Ally']];
const relWord=n=>REL_WORDS.find(([max])=>n<max)[1];
const REACH=50000;
function apply(s,fx){
  const chips=[];if(!fx)return chips;
  if(fx.money){s.money+=Math.round(fx.money);chips.push({t:(fx.money>0?'+':'')+naira(fx.money),k:fx.money>0?'up':'down'});}
  if(fx.earn){
    const gross=Math.round(fx.earn),t=takeHome(s,gross);s.money+=t.net;
    chips.push({t:'+'+naira(t.net),k:'up'});
    if(t.net<gross)chips.push({t:naira(gross-t.net)+' to '+listOf(t.who),k:'note'});
  }
  let gain=0;
  if(fx.fans)gain+=Math.round(fx.fans);
  if(fx.fansUp)gain+=Math.max(fx.fansUp[0],Math.round(s.fans*fx.fansUp[1]));
  if(fx.fansPct)gain+=Math.round(s.fans*fx.fansPct);
  // From the second season Lagos already knows you, so new fans come harder the more you have (REACH).
  // Without this, fans and money grow without limit in a second year. The first season is unchanged.
  if(gain>0&&s.season>1)gain=Math.round(gain*REACH/(REACH+s.fans));
  if(gain){s.fans=Math.max(0,s.fans+gain);chips.push({t:(gain>0?'+':'−')+fansFmt(Math.abs(gain))+' fans',k:gain>0?'up':'down'});}
  for(const k of ['skill','hype','cred','links']){
    if(!fx[k])continue;
    const before=s[k];s[k]=clamp(Math.round(s[k]+fx[k]),0,100);
    const d=s[k]-before;
    if(d)chips.push({t:(d>0?'+':'−')+Math.abs(d)+' '+STAT_NAMES[k],k:d>0?'up':'down'});
  }
  if(fx.energyNext){s.energyNext+=fx.energyNext;chips.push({t:'1 fewer move next week',k:'down'});}
  if(fx.rent){s.rent+=fx.rent;chips.push({t:'Rent is now '+naira(s.rent),k:'down'});}
  if(fx.flag)Object.assign(s.flags,fx.flag);
  if(fx.rel){s.rel=s.rel||{};for(const id in fx.rel){const d=Math.round(fx.rel[id]);s.rel[id]=clamp((s.rel[id]||0)+d,-10,10);if(d)chips.push({t:CAST[id].name+(d>0?' will remember that kindly':' will hold that against you'),k:d>0?'up':'down'});}}
  if(fx.note)chips.push({t:fx.note,k:'note'});
  return chips;
}

// Puts the best work in the vault out into the world (a song release, a role on screen) and works out the fans it brings.
function putOut(s){
  s.vault.sort((a,b)=>b.q-a.q);
  const song=s.vault.shift(),q=song.q;
  const since=s.lastRelease?s.week-s.lastRelease:9;
  const fatigue=since<=0?0.35:since===1?0.6:since===2?0.8:1;
  let gain=q*5*(1+s.hype/40)+s.fans*(q/100)*(0.3+s.hype/150);
  gain*=(1+s.links/250)*(1+s.cred/300)*fatigue;
  let note;
  if(s.flags.blessing){gain*=1.3;delete s.flags.blessing;note='Mummy’s prayers worked';}
  const hit=q>=65&&R.p(0.12+s.hype/300);
  if(hit)gain*=2;
  s.songs.push({title:song.title,q,week:s.week});s.lastRelease=s.week;
  return {song,q,fatigue,gain,hit,note};
}

// The story cards (CAST, EVENTS, FOLLOWUPS, DECEMBER, PREMIERES) live in stories.js, loaded before this script.
// The rules below pick a story each week and apply the chosen result.
// A story tagged careers:['music'] only happens in those careers. Untagged stories happen in every career.
// A story with fromSeason:2 waits for the player's second season (docs/adr/0010-seasons-carry-over.md).
const forCareer=(e,s)=>(!e.careers||e.careers.includes(careerOf(s).id))&&!(e.fromSeason>(s.season||1));
function pickEvent(s){
  if(s.week===22)return careerOf(s).december;
  const due=FOLLOWUPS.find(e=>!s.seen.includes(e.id)&&forCareer(e,s)&&e.when(s));
  if(due)return due;
  // A story with a group shuts out the rest of its group for the game. Weights default to 1.
  const used=new Set(EVENTS.filter(e=>e.group&&s.seen.includes(e.id)).map(e=>e.group));
  const pool=EVENTS.filter(e=>!s.seen.includes(e.id)&&!used.has(e.group)&&forCareer(e,s)&&e.when(s));
  if(!pool.length||(s.week>1&&!R.p(0.85)))return null;
  const wt=e=>e.weight===undefined?1:e.weight;
  let r=R.n(0,pool.reduce((a,e)=>a+wt(e),0));
  for(const e of pool)if((r-=wt(e))<0)return e;
  return pool[pool.length-1];
}
function choiceState(s,c){

function choose(s,ev,i){

  chips.push(...apply(s,res.fx));
  s.seen.push(ev.id);
  return {label:c.label,text:res.text,chips};
}

const PEOPLE_COST=[120000,50000,15000,0,0];
function wrapWeek(s){
  const lines=[],wk=s.week;
  const inc=careerOf(s).income,gross=inc.gross(s);
  if(gross>0){
    const t=takeHome(s,gross);s.money+=t.net;
    lines.push({l:inc.label,v:'+'+naira(t.net),k:'up',sub:t.net<gross?naira(gross-t.net)+' went to '+listOf(t.who):''});
  }else lines.push({l:inc.label,v:'₦0',sub:s.songs.length?'':inc.none});
  s.money-=12000;lines.push({l:'Food, data, transport',v:naira(-12000),k:'down'});
  const crew=PEOPLE_COST[tierOf(s.fans,s).i];
  if(crew){s.money-=crew;lines.push({l:'Your people',v:naira(-crew),k:'down',sub:'Stylist, security, and cousins who suddenly remember you'});}
  if(wk%4===0){s.money-=s.rent;lines.push({l:'Rent',v:naira(-s.rent),k:'down'});}
  if(s.flags.manager)s.links=clamp(s.links+2,0,100);
  const h0=s.hype;s.hype=Math.max(0,Math.round(s.hype*0.8-2));
  if(h0>s.hype)lines.push({l:'Hype cooled',v:'−'+(h0-s.hype),k:'down'});
  if(s.money<0){
    const interest=Math.round(-s.money*0.1);s.money-=interest;
    s.cred=clamp(s.cred-3,0,100);s.links=clamp(s.links-2,0,100);
    lines.push({l:'SapaLoan interest',v:naira(-interest),k:'down',sub:'You are in debt, and the loan app is texting your contacts. −3 street cred, −2 links'});
  }
  s.week++;s.energy=Math.max(1,3+s.energyNext);s.energyNext=0;
  // From the second season, January (weeks 1 to 4) has its own slogans.
  s.opener=R.pick(careerOf(s).openers);s.slogan=R.pick(s.season>1&&s.week<=4?careerOf(s).year.slogans:careerOf(s).slogans);s.log=[];
  if(s.money<-400000)s.over=debtEnding(s);
  return {wk,lines};
}

  if(due&&s.money<s.rent)return 'Find '+naira(s.rent-s.money)+' more before rent is due this week.';
  if(!s.vault.length&&!s.songs.length)return s.money>=fee?'Go to your first audition. It takes 2 moves.':'Raise '+naira(fee)+' for transport to an audition. Try a side hustle.';
  if(s.vault.length&&!s.songs.length)return 'Shoot your first role so people can see you.';
  if(s.vault.length&&(!s.lastRelease||s.week-s.lastRelease>=2))return 'Shoot “'+s.vault.slice().sort((a,b)=>b.q-a.q)[0].title+'” next.';
  if(s.hype<15)return 'Build hype before your next role. Post content or do a stage play.';
  return s.money>=fee?'Go to another audition while the hype is up.':'Do stage plays and hustle to fund your next audition.';
}
// Streaming licences: a smaller weekly tail than music streams. Actors earn most of their money from role fees.
function licenceGross(s){return Math.round(streamGross(s)*0.5);}

function tally(s){

  return [
    ['Fans',fansFmt(s.fans)],

}

function finale(s){
  const c=careerOf(s),{show,fx}=c.finaleShow(s,s.flags.dec||'none');
  const chips=apply(s,fx);
  const tier=tierOf(s.fans,s),verdict=c.verdicts[tier.i];
  const notes=[],last=s.history&&s.history[s.history.length-1];
  if(last)notes.push(tier.i<last.rank?'Up from '+last.title+' last year.':tier.i>last.rank?'Down from '+last.title+' last year.':last.title+' again, like last year.');
  if(s.flags.signed)notes.push('Gbedu Empire owns every master you recorded'+(s.recoup>0?', and you still owe them '+naira(s.recoup)+' before you see a kobo.':'. Page 31 says so.'));
  if(s.flags.signedGood)notes.push('You kept your masters. Barrister Amaka has framed the contract in her office.');
  if(s.flags.investor)notes.push('Chad owns 30% of you and describes you at dinners as “my Africa play.”');
  if(s.flags.manager)notes.push('Aunty Bisi takes her 20% and earns it, mostly.');
  if(!s.flags.signed&&!s.flags.signedGood&&!s.flags.investor&&!s.flags.manager&&s.fans>=10000)notes.push('Nobody owns a piece of you. Every kobo that comes next is yours.');
  if(s.flags.award)notes.push(by(s,{music:'There is a Next Rated plaque on your mother’s television.',actor:'There is a Golden Clapper statuette on your mother’s television.'}));
  if(s.flags.intl)notes.push('You have a UK entry stamp and a fanbase in Peckham.');
  if(s.cred<=15)notes.push(c.words.sellout);
  else if(s.cred>=70)notes.push('The streets still claim you. No plaque is worth more.');
  if(s.money>=5000000)notes.push('You end the year with '+naira(s.money)+'. Your mother has started house-hunting on your behalf.');
  else if(s.money>=0)notes.push('You end the year with '+naira(s.money)+' to your name.');
  else notes.push('You end the year owing SapaLoan '+naira(-s.money)+'.');
  return {kind:'end',title:tier.name,rank:tier.i,week:TOTAL_WEEKS,show,verdict,notes,chips,tally:tally(s)};
}

// Seasons (docs/adr/0010-seasons-carry-over.md). After December the career carries on into a new year with the same
// name and career. Fans drop to 80%, hype resets, and everything else stays: money and debt, stats, deals, songs,
// the vault, flags and rent. A number flag of TOTAL_WEEKS or less is a week, as are each song's week and lastRelease.
// They move back a year (27 weeks: the January break counts as one), so "weeks since" keeps counting and a
// follow-up that was due in December arrives in January. Seen stories reset, except follow-ups and stories marked
// once:'career', which happen once per career.
const YEAR=TOTAL_WEEKS+1;
function newSeason(s){
  const c=careerOf(s),o=s.over;
  s.history.push({season:s.season,title:o.title,rank:o.rank,fans:s.fans,money:s.money});
  const kept=Math.round(s.fans*0.8),lost=s.fans-kept;
  s.fans=kept;s.hype=0;
  for(const k in s.flags){const x=s.flags[k];if(typeof x==='number'&&Number.isInteger(x)&&x<=TOTAL_WEEKS)s.flags[k]=x-YEAR;}
  delete s.flags.dec;
  for(const x of s.songs)x.week-=YEAR;
  if(s.lastRelease)s.lastRelease-=YEAR;
  const once=new Set([...FOLLOWUPS,...EVENTS.filter(e=>e.once==='career')].map(e=>e.id));
  s.seen=s.seen.filter(id=>once.has(id));
  Object.assign(s,{season:s.season+1,week:1,energy:3,energyNext:0,promoWeek:0,log:[],over:null,
    opener:c.year.opener+(lost?' '+fansFmt(lost)+' fans drifted away over the holidays.':''),slogan:R.pick(c.year.slogans)});
  return s;
}

// Saves (docs/adr/0004-saves-in-local-storage.md). migrate(save) brings an older save up to the current version, 2,
// or returns null for anything it does not recognise. Version 1 had no seasons, so a version 1 save becomes season 1.
// A save from before careers is a music save, and one from before relationships gets an empty rel.
// Calling it on a version 2 save changes nothing.
function migrate(x){
  if(!x||typeof x!=='object'||Array.isArray(x))return null;
  if(typeof x.name!=='string'||typeof x.week!=='number'||!x.flags||typeof x.flags!=='object'||!Array.isArray(x.seen)||!Array.isArray(x.songs)||!Array.isArray(x.vault))return null;
  if(x.v===1)x=Object.assign({},x,{v:2,season:1,history:[]});
  if(x.v!==2)return null;
  if(!x.career)x.career='music';
  if(!CAREERS[x.career])return null;
  if(!(x.season>=1))x.season=1;
  if(!Array.isArray(x.history))x.history=[];
  if(!x.rel||typeof x.rel!=='object')x.rel={};
  return x;
}

    return '<form class="feedback" data-feedback novalidate>'+
      '<h2'+(inSheet?' id="sheet-title" tabindex="-1"':'')+'>Tell us how it went</h2>'+
      '<p class="act-sub">One minute. We never ask for your name.</p>'+
      '<fieldset><legend>How long did you play?</legend>'+opts('duration',['Under 10 minutes','10 to 20 minutes','20 to 40 minutes','Over 40 minutes'])+'</fieldset>'+
      '<label class="field" for="fb-confused">Did anything confuse or bore you? Which week?<textarea id="fb-confused" name="confused" rows="3" maxlength="1000"></textarea></label>'+
      '<label class="field" for="fb-favourite">Your favourite story or moment<input type="text" id="fb-favourite" name="favourite" maxlength="200"></label>'+
      '<fieldset><legend>Would you play again?</legend>'+opts('again',['Yes','Maybe','No'])+'</fieldset>'+
      '<label class="field" for="fb-anything">Anything else?<textarea id="fb-anything" name="anything" rows="2" maxlength="1000"></textarea></label>'+
      '<label class="hp" aria-hidden="true">Leave this empty<input type="text" name="company" tabindex="-1" autocomplete="off"></label>'+
      '<button class="primary" type="submit">Send feedback</button>'+
      (inSheet?'<button class="secondary" type="button" data-cmd="close-sheet">Back to the game</button>':'')+
      '<p class="fb-status" role="status" aria-live="polite"></p>'+
      '</form>';
  }
  function sendFeedback(form){
    const status=form.querySelector('.fb-status'),btn=form.querySelector('[type=submit]');
    const data=new URLSearchParams(new FormData(form));
    if(!['duration','confused','favourite','again','anything'].some(k=>(data.get(k)||'').trim())){status.textContent='Answer at least one question first.';return;}
    data.set('form-name','feedback');
    data.set('ending',S&&S.over?S.over.title:'Still playing');
    if(S){data.set('career',S.career||'music');data.set('background',S.bg);data.set('week',String(S.week));data.set('fans',String(S.fans));}
    btn.disabled=true;status.textContent='Sending…';
    fetch('/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:data.toString()})
      .then(r=>{if(!r.ok)throw new Error(r.status);form.innerHTML='<h2'+(form.querySelector('#sheet-title')?' id="sheet-title" tabindex="-1"':'')+'>Thank you</h2><p class="fb-status" role="status">Your feedback is in. It helps decide what we build next.</p>'+(ui.sheet?'<button class="secondary" type="button" data-cmd="close-sheet">Back to the game</button>':'');})
      .catch(()=>{btn.disabled=false;status.textContent='That did not send. Check your connection and try again.';});
  }

  function renderEnd(){
    const o=S.over;
    app.innerHTML=
      '<header><div class="danfo danfo-title end-name"><p>'+h(S.name)+(S.season>1?', season '+S.season:'')+', after '+o.week+' weeks</p><h1 class="title">'+h(o.title)+'</h1></div>'+
      '<div class="danfo danfo-title" style="padding-top:0"><div class="stripe">'+h(nm(S.slogan||'No condition is permanent'))+'</div><div class="stripe-thin"></div></div></header>'+
      '<main class="pad stack">'+
      '<div><p class="lede">'+h(nm(o.show))+'</p>'+chipsHtml(o.chips)+'</div>'+
      '<p class="verdict">'+h(o.verdict)+'</p>'+
      (o.notes.length?'<ul class="notes">'+o.notes.map(n=>'<li>'+h(n)+'</li>').join('')+'</ul>':'')+
      '<ul class="tally">'+o.tally.map(r=>'<li><span>'+h(r[0])+'</span><b>'+h(r[1])+'</b></li>').join('')+'</ul>'+
      // Every season so far, once there is more than one (docs/adr/0010-seasons-carry-over.md).
      (S.history.length?'<div><h2 class="career-head">Your career</h2><ul class="tally">'+S.history.concat({season:S.season,title:o.title,fans:S.fans}).map(x=>'<li><span>Season '+x.season+'</span><b>'+h(x.title)+', '+fansFmt(x.fans)+' fans</b></li>').join('')+'</ul></div>':'')+
      feedbackHtml(false)+
      // After a December the career can carry on. Sapa winning ends it.
      (o.kind==='end'?'<button class="primary" data-cmd="season">Start season '+(S.season+1)+'</button><button class="secondary" data-cmd="again">Play again</button>':'<button class="primary" data-cmd="again">Play again</button>')+
      '</main>';
  }

  // While a sheet is open, the page behind it is inert, so keyboard focus stays in the sheet.
  // When it closes, focus moves to what changed: the end screen's title, or this week's opening line.
  let sheetOpen=false;
  function sheetFocus(open){
    app.inert=open;
    if(!open&&sheetOpen)requestAnimationFrame(()=>{
      const t=app.querySelector('.end-name .title, .latest');
      if(t){t.setAttribute('tabindex','-1');t.focus({preventScroll:true});}
    });
    sheetOpen=open;
  }

  function renderSheet(){
    const sh=ui.sheet;sheetFocus(!!sh);
    if(!sh){sheetEl.hidden=true;sheetEl.innerHTML='';document.body.style.overflow='';return;}
    const s=S;let html='<div class="sheet-card">';
    if(sh.phase==='feedback'){
      html+=feedbackHtml(true);
    }else if(sh.phase==='event'){
      const ev=sh.ev,choices=val(ev.choices,s);
      html+='<h2 id="sheet-title" tabindex="-1">'+h(val(ev.title,s))+'</h2><p class="who">'+h(val(ev.who,s))+'</p><p class="story">'+h(nm(val(ev.text,s)))+'</p><div class="choices">'+
        choices.map((c,i)=>{const st=choiceState(s,c);return '<button class="choice" data-choice="'+i+'"'+(st.ok?'':' disabled')+'><span class="choice-label">'+h(c.label)+'</span><span class="choice-cost">'+(st.cost?naira(st.cost):'')+'</span><span class="choice-hint">'+h(st.ok?val(c.hint,s)||'':'You cannot afford this.')+'</span></button>';}).join('')+
        '</div>';
    }else{
      if(sh.ev){
        html+='<h2 id="sheet-title" tabindex="-1">'+h(val(sh.ev.title,s))+'</h2><p class="picked">You chose: '+h(sh.res.label)+'</p><p class="story">'+h(nm(sh.res.text||''))+'</p>'+chipsHtml(sh.res.chips);
      }else{
        html+='<h2 id="sheet-title" tabindex="-1">A quiet week</h2><p class="story">Nobody called, nothing broke, nobody dragged you online. In Lagos, that is news.</p>';
      }
      const last=s.over||s.week>TOTAL_WEEKS;
      html+='<div class="wrap"><h3>Week '+sh.wrap.wk+' closes</h3><ul>'+sh.wrap.lines.map(l=>'<li><span>'+h(l.l)+'</span><b class="'+(l.k||'')+'">'+h(l.v)+'</b>'+(l.sub?'<small>'+h(l.sub)+'</small>':'')+'</li>').join('')+'</ul>'+
        '<button class="primary" data-cmd="next">'+(s.over?'Continue':last?'See how December went':'Start week '+s.week)+'</button></div>';
    }
    html+='</div>';
    sheetEl.innerHTML=html;sheetEl.hidden=false;document.body.style.overflow='hidden';
    const card=sheetEl.querySelector('.sheet-card');card.scrollTop=0;
    const t=document.getElementById('sheet-title');if(t)t.focus({preventScroll:true});
  }

  function render(){
    if(ui.screen==='title')renderTitle();
    else if(ui.screen==='end')renderEnd();
    else renderGame();
    renderSheet();
  }

  function startGame(){
    const input=document.getElementById('name');
    const name=(input.value||'').trim().slice(0,18)||R.pick(STAGE_NAMES);
    const bgs=Object.keys(CAREERS[ui.career].backgrounds);
    const bg=(document.querySelector('input[name="bg"]:checked')||{}).value||bgs[0];
    S=newGame(name,bgs.includes(bg)?bg:bgs[0],ui.career);ui.screen='game';ui.prev=null;save();render();window.scrollTo(0,0);
  }

  document.addEventListener('click',e=>{
    const el=e.target.closest('[data-act],[data-choice],[data-cmd]');if(!el||el.disabled)return;
    if(el.dataset.act){
      if(doAction(S,el.dataset.act)){
        ui.fresh=true;ui.confirmRestart=false;save();renderGame();
        const box=app.querySelector('.latest');
        if(box&&box.getBoundingClientRect().top<140)box.scrollIntoView({block:'start',behavior:'smooth'});
      }
      return;
    }
    if(el.dataset.choice!==undefined){
      const sh=ui.sheet;if(!sh||sh.phase!=='event')return;
      const res=choose(S,sh.ev,+el.dataset.choice);
      const wrap=wrapWeek(S);
      ui.sheet={phase:'wrap',ev:sh.ev,res,wrap};renderSheet();return;
    }
    switch(el.dataset.cmd){
      case 'suggest':{const i=document.getElementById('name');i.value=R.pick(STAGE_NAMES.filter(n=>n!==i.value));break;}
      case 'start':startGame();break;
      case 'continue':S=load();if(S){ui.screen=S.over?'end':'game';ui.prev=null;render();window.scrollTo(0,0);}break;
      case 'endweek':{
        ui.confirmRestart=false;
        const ev=pickEvent(S);
        ui.sheet=ev?{phase:'event',ev}:{phase:'wrap',ev:null,wrap:wrapWeek(S)};
        renderSheet();break;}
      case 'next':
        ui.sheet=null;
        if(!S.over&&S.week>TOTAL_WEEKS)S.over=finale(S);
        if(S.over)ui.screen='end';
        save();render();window.scrollTo(0,0);break;
      case 'feedback':ui.sheet={phase:'feedback'};renderSheet();break;
      case 'close-sheet':ui.sheet=null;renderSheet();break;
      case 'season':if(S&&S.over&&S.over.kind==='end'){newSeason(S);ui.screen='game';ui.sheet=null;ui.prev=null;save();render();window.scrollTo(0,0);}break;
      case 'restart':ui.confirmRestart=true;renderGame();break;
      case 'restart-no':ui.confirmRestart=false;renderGame();break;
      case 'restart-yes':
      case 'again':clearSave();S=null;ui.screen='title';ui.sheet=null;ui.confirmRestart=false;render();window.scrollTo(0,0);break;
    }
  });
  document.addEventListener('change',e=>{
    if(e.target.name!=='career')return;
    const name=document.getElementById('name').value;
    ui.career=e.target.value;renderTitle();
    document.getElementById('name').value=name;document.querySelector('input[name="career"]:checked').focus();
  });
  document.addEventListener('submit',e=>{
    if(e.target.matches('[data-feedback]')){e.preventDefault();sendFeedback(e.target);}
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&e.target&&e.target.id==='name'){e.preventDefault();startGame();}
  });

  render();
}
</script>
</body>
</html>
